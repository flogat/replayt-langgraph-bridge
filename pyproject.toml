[project]
name = "replayt-langgraph-bridge"
version = "0.1.0"
description = "LangGraph adapter mapping replayt workflow states to graph nodes and checkpoints: Python project using replayt; see docs for scope."
requires-python = ">=3.11"
dependencies = [
  # replayt: 0.4.x integration target; <0.5 until 0.5 is published and CI-green (BACKLOG_REPLAYT_05_READINESS,
  # docs/COMPATIBILITY_UPDATE_REPLAYT_05.md).
  "replayt>=0.4.0,<0.5",
  
  # langgraph: Initial integration target is 1.1.x series  
  # Upper bound prevents automatic upgrades to breaking 1.2.x changes
  "langgraph>=1.1.0,<1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
  "pip-audit>=2.7.0",
  # PEP 561 smoke for bridge-owned modules; upstream deps use ignore_missing_imports in [tool.mypy]
  "mypy>=1.11.0",
  # SQLite LangGraph checkpointer for disk round-trip CI (not part of default pip install surface)
  "langgraph-checkpoint-sqlite>=2.0.0",
]
# Vendor LLM HTTP/API clients and thin LangChain wrappers for samples only—not required for the public bridge API.
demo = [
  # OpenAI official SDK (chat/completions API)
  "openai>=1.0.0",
  # Anthropic official SDK (Messages API)
  "anthropic>=0.18.0",
  # LangChain routing to OpenAI models (pulls vendor client usage paths)
  "langchain-openai>=0.2.0",
  # LangChain routing to Anthropic models
  "langchain-anthropic>=0.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
replayt_langgraph_bridge = ["py.typed"]

[tool.mypy]
python_version = "3.11"
# Resolve the package as replayt_langgraph_bridge (not src.*); mypy_path matches src layout.
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
# Smoke scope: type-check bridge modules only; do not pull full upstream graphs into analysis.
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
